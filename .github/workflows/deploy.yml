name: Deploy

# Runs once the repo variable DEPLOY_ENABLED is "true". Secrets come from 1Password via the
# OP_SERVICE_ACCOUNT repo secret, see .github/actions/load-secrets.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: 📋 Terraform plan
    if: github.event_name == 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: 🔑 Load secrets
        uses: ./.github/actions/load-secrets
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT }}

      - name: 🚀 Terraform init
        run: terraform -chdir=infra init -input=false

      - name: 📋 Terraform plan
        run: |
          terraform -chdir=infra plan -input=false -no-color -lock=false -out=tfplan
          {
            echo "## 📋 Terraform plan"
            echo ""
            echo '```'
            terraform -chdir=infra show -no-color tfplan | tail -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 🔑 Load secrets
        uses: ./.github/actions/load-secrets
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT }}

      - name: 🚀 Terraform init
        run: terraform -chdir=infra init -input=false

      # Cloudflare refuses a custom domain for a Worker with no deployments, so attach it
      # after the first deploy. On later runs the second apply is a no-op.
      - name: 🚀 Terraform apply
        run: |
          terraform -chdir=infra apply -input=false -auto-approve \
            -target=cloudflare_worker.site \
            -target=cloudflare_account_token.r2 \
            -target=cloudflare_r2_bucket_lifecycle.builds \
            -target=random_password.api_key

      - name: 🔑 Export Worker secrets
        run: |
          set -euo pipefail
          terraform -chdir=infra output -json worker_secrets > "$RUNNER_TEMP/secrets.json"
          jq -r '.[]' "$RUNNER_TEMP/secrets.json" | while IFS= read -r value; do
            echo "::add-mask::$value"
          done
          echo "CLOUDFLARE_ACCOUNT_ID=$(terraform -chdir=infra output -raw account_id)" >> "$GITHUB_ENV"

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🏗 Build
        run: bunx opennextjs-cloudflare build

      - name: 🚀 Deploy Worker
        run: bunx opennextjs-cloudflare deploy --secrets-file "$RUNNER_TEMP/secrets.json"

      - name: 🌐 Attach custom domain
        run: terraform -chdir=infra apply -input=false -auto-approve

      - name: 🧹 Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"

      - name: 📊 Summary
        run: echo "## 🚀 Deployed to $(terraform -chdir=infra output -raw url)" >> "$GITHUB_STEP_SUMMARY"
