name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run ts:check
      - run: bun test
      - run: bunx opennextjs-cloudflare build

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive
      - name: Worker name matches wrangler.jsonc
        run: |
          tf=$(sed -nE 's/^name *= *"(.*)"/\1/p' infra/terraform.tfvars)
          wr=$(sed -nE 's/^  "name": "(.*)",/\1/p' wrangler.jsonc)
          if [ -z "$tf" ] || [ "$tf" != "$wr" ]; then
            echo "::error::name in infra/terraform.tfvars ($tf) must match wrangler.jsonc ($wr), or the custom domain points at a Worker that never gets deployed"
            exit 1
          fi
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
