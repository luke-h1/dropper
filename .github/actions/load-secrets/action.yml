name: "Load Secrets"
inputs:
  op_service_account_token:
    description: "1Password service account token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Load secrets
      uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
      with:
        export-env: true
        version: 2.34.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op_service_account_token }}
        CLOUDFLARE_API_TOKEN: op://ci-cd/ipa-apk-distributer/CLOUDFLARE_API_TOKEN
        AWS_ACCESS_KEY_ID: op://ci-cd/ipa-apk-distributer/AWS_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY: op://ci-cd/ipa-apk-distributer/AWS_SECRET_ACCESS_KEY

    - name: Assert every value loaded
      uses: ./.github/actions/assert-env
      with:
        source: "op://ci-cd/ipa-apk-distributer"
        hint: "terraform cannot reach its S3 state or Cloudflare"
        names: |
          CLOUDFLARE_API_TOKEN
          AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY
